services:
  db:
    image: postgres:latest
    container_name: postgres_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=todos_db

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    networks:
      - py_post

volumes:
  postgres_data:

networks:
  py_post:
    driver: bridge
